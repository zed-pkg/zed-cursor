name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'agent/**'

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - run: npx @vscode/vsce package --out zed-cursor-ci.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: zed-cursor-ci-vsix
          path: zed-cursor-ci.vsix

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: analyzer
      - run: cargo fmt --manifest-path analyzer/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path analyzer/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path analyzer/Cargo.toml --all-targets
