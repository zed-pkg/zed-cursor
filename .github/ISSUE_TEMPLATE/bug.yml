name: Bug report
description: Report incorrect diagnostics, command behavior, or Cursor integration problems.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: input
    id: cursor
    attributes:
      label: Cursor version
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Remove credentials and proprietary package details.
    validations:
      required: true
